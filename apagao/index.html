<!doctype html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apagão</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #out { display: block; height: 100vh; margin: 0 auto; }
  #play { position: fixed; inset: 0; margin: auto; width: 180px; height: 56px; font: bold 18px sans-serif; background: #c0301c; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
</style>
<script src="timeline.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ====================================================================
//  "APAGÃO" — 3D com luz física, sombras, bloom e grade de cor
// ====================================================================
const TL = window.TL, M = TL.marks, SUB = TL.subs;
const RW = 720, RH = 1280, OW = 1080, OH = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(RW, RH, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, RW / RH, 0.02, 3000);

const rt = new THREE.WebGLRenderTarget(RW, RH, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(RW, RH), 0.8, 0.5, 1.0); composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVig: { value: 1.0 }, uGrain: { value: 0.05 }, uCA: { value: 0.0015 }, uTint: { value: new THREE.Vector3(1, 1, 1) }, uFlash: { value: 0 }, uBlack: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uVig, uGrain, uCA, uFlash, uBlack; uniform vec3 uTint; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec2 c = vUv - 0.5; float d = length(c * vec2(0.75, 1.0));
      vec3 col; col.r = texture2D(tDiffuse, vUv + c * uCA * 2.0).r; col.g = texture2D(tDiffuse, vUv).g; col.b = texture2D(tDiffuse, vUv - c * uCA * 2.0).b;
      col *= uTint;
      col *= mix(1.0, smoothstep(0.85, 0.25, d), uVig);
      col += (h(vUv * 1000.0 + uTime) - 0.5) * uGrain * (0.4 + col);
      col = mix(col, vec3(4.0), uFlash); col *= (1.0 - uBlack);
      gl_FragColor = vec4(col, 1.0);
    }`,
});
composer.addPass(grade); composer.addPass(new OutputPass());

// ---------- utilidades ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => { k = clamp(k); return k * k * (3 - 2 * k); };
const easeOut = (k) => 1 - Math.pow(1 - clamp(k), 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const noise1 = (t, s = 0) => Math.sin(t * 1.7 + s) * 0.5 + Math.sin(t * 2.9 + s * 3.1) * 0.3 + Math.sin(t * 5.3 + s * 1.7) * 0.2;
function ctex(w, h, draw, rep, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t;
}
function speckle(g, w, h, base, amt, seed, n = 4000) {
  g.fillStyle = base; g.fillRect(0, 0, w, h); const r = rng(seed);
  for (let i = 0; i < n; i++) { const v = (r() - 0.5) * amt; g.fillStyle = v > 0 ? `rgba(255,255,255,${v})` : `rgba(0,0,0,${-v})`; g.fillRect(r() * w, r() * h, 1 + r() * 3, 1 + r() * 3); }
}
const std = (o) => new THREE.MeshStandardMaterial(o);
function add(geo, mat, parent, pos, rot, scale, shadow = true) {
  const m = new THREE.Mesh(geo, mat); if (pos) m.position.set(...pos); if (rot) m.rotation.set(...rot); if (scale) m.scale.set(...scale);
  m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
const grp = (parent, pos = [0, 0, 0]) => { const g = new THREE.Group(); g.position.set(...pos); parent.add(g); return g; };

// ====================================================================
//  TEXTURAS
// ====================================================================
const TX = {};
TX.plaster = ctex(512, 512, (g, w, h) => { speckle(g, w, h, '#8f877c', 0.06, 1, 9000); }, [3, 2]);
TX.wood = ctex(512, 512, (g, w, h) => {
  g.fillStyle = '#4a3020'; g.fillRect(0, 0, w, h); const r = rng(2);
  for (let y = 0; y < h; y += 64) { const c = 60 + r() * 30; g.fillStyle = `rgb(${c + 20},${c * 0.62},${c * 0.4})`; g.fillRect(0, y, w, 62);
    for (let i = 0; i < 40; i++) { g.strokeStyle = `rgba(30,15,5,${0.1 + r() * 0.2})`; g.beginPath(); const yy = y + r() * 62; g.moveTo(0, yy); g.bezierCurveTo(w * 0.3, yy + (r() - 0.5) * 8, w * 0.6, yy + (r() - 0.5) * 8, w, yy); g.stroke(); }
    g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, y + 62, w, 2); g.fillRect(r() * w, y, 2, 64); }
}, [3, 3]);
TX.rug = ctex(512, 512, (g, w, h) => {
  speckle(g, w, h, '#5a2e2a', 0.12, 3, 12000); g.strokeStyle = 'rgba(210,170,110,0.45)'; g.lineWidth = 10; g.strokeRect(30, 30, w - 60, h - 60);
  g.lineWidth = 4; g.strokeRect(60, 60, w - 120, h - 120); g.fillStyle = 'rgba(210,170,110,0.35)';
  for (let i = 0; i < 6; i++) { g.save(); g.translate(w / 2, h / 2); g.rotate(i * Math.PI / 3); g.beginPath(); g.ellipse(0, 90, 30, 70, 0, 0, 7); g.fill(); g.restore(); }
});
TX.fabric = ctex(256, 256, (g, w, h) => { speckle(g, w, h, '#3a4250', 0.1, 4, 8000); g.strokeStyle = 'rgba(0,0,0,0.08)'; for (let i = 0; i < w; i += 3) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); } }, [2, 2]);
TX.hoodie = ctex(256, 256, (g, w, h) => speckle(g, w, h, '#2b2d33', 0.12, 5, 8000), [2, 2]);
TX.jeans = ctex(256, 256, (g, w, h) => { speckle(g, w, h, '#2b3a5a', 0.14, 6, 8000); g.strokeStyle = 'rgba(255,255,255,0.05)'; for (let i = -h; i < w; i += 4) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + h, h); g.stroke(); } }, [2, 2]);
TX.skinC = ctex(256, 256, (g, w, h) => {
  speckle(g, w, h, '#a8a097', 0.08, 7, 6000); g.strokeStyle = 'rgba(80,60,90,0.35)'; const r = rng(8);
  for (let i = 0; i < 30; i++) { g.beginPath(); let x = r() * w, y = r() * h; g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += (r() - 0.5) * 30; y += r() * 20; g.lineTo(x, y); } g.stroke(); }
}, [2, 2]);
TX.radio = ctex(256, 256, (g, w, h) => { speckle(g, w, h, '#6a4a2c', 0.1, 9, 5000); for (let y = 0; y < h; y += 6) { g.fillStyle = 'rgba(30,15,5,0.25)'; g.fillRect(0, y, w, 2); } });
TX.grille = ctex(256, 256, (g, w, h) => { g.fillStyle = '#1c1a18'; g.fillRect(0, 0, w, h); g.fillStyle = '#4a4440'; for (let y = 4; y < h; y += 9) for (let x = 4; x < w; x += 9) { g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); } });
TX.door = ctex(256, 512, (g, w, h) => {
  speckle(g, w, h, '#5a3e28', 0.08, 10, 6000); g.strokeStyle = 'rgba(20,10,0,0.6)'; g.lineWidth = 6; g.strokeRect(30, 40, w - 60, 180); g.strokeRect(30, 260, w - 60, 210);
  g.strokeStyle = 'rgba(255,220,180,0.12)'; g.lineWidth = 2; g.strokeRect(34, 44, w - 68, 172); g.strokeRect(34, 264, w - 68, 202);
});
// fachadas: concreto + grade de janelas; e mapa emissivo das janelas acesas
function facade(seed, cols, rows, litP = 0.6) {
  const r = rng(seed), w = 256, h = 512;
  const map = ctex(w, h, (g) => {
    speckle(g, w, h, '#6e6c68', 0.12, seed, 6000);
    const cw = w / cols, rh = h / rows;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) { g.fillStyle = '#1a1e24'; g.fillRect(x * cw + cw * 0.18, y * rh + rh * 0.2, cw * 0.64, rh * 0.55); g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x * cw, y * rh + rh * 0.82, cw, rh * 0.06); }
  });
  const em = ctex(w, h, (g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h); const cw = w / cols, rh = h / rows;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) if (r() < litP) {
      const warm = r() < 0.75; g.fillStyle = warm ? `rgb(255,${170 + r() * 50},${90 + r() * 40})` : `rgb(${150 + r() * 40},${200 + r() * 30},255)`;
      g.globalAlpha = 0.5 + r() * 0.5; g.fillRect(x * cw + cw * 0.18, y * rh + rh * 0.2, cw * 0.64, rh * 0.55);
    }
    g.globalAlpha = 1;
  });
  return { map, em };
}

// ====================================================================
//  CIDADE (gancho)
// ====================================================================
const CITY = grp(scene);
add(new THREE.PlaneGeometry(4000, 4000), std({ color: 0x0c0d10, roughness: 1 }), CITY, [0, 0, 0], [-Math.PI / 2, 0, 0], null, false);
const buildings = [];
{
  const r = rng(77), F = [facade(11, 6, 20), facade(12, 8, 26), facade(13, 5, 16), facade(14, 10, 30)];
  for (let gx = -9; gx <= 9; gx++) for (let gz = -14; gz <= 3; gz++) {
    if (r() < 0.12) continue;
    const w = 14 + r() * 12, d = 14 + r() * 12, hgt = 18 + Math.pow(r(), 1.7) * 140;
    const x = gx * 34 + (r() - 0.5) * 6, z = gz * 34 + (r() - 0.5) * 6;
    const f = F[Math.floor(r() * F.length)];
    const mat = std({ map: f.map, emissiveMap: f.em, emissive: 0xffffff, emissiveIntensity: 1.6, roughness: 0.9 });
    mat.map = f.map.clone(); mat.map.needsUpdate = true; mat.map.wrapS = mat.map.wrapT = THREE.RepeatWrapping; mat.map.repeat.set(w / 20, hgt / 40);
    mat.emissiveMap = f.em.clone(); mat.emissiveMap.needsUpdate = true; mat.emissiveMap.wrapS = mat.emissiveMap.wrapT = THREE.RepeatWrapping; mat.emissiveMap.repeat.copy(mat.map.repeat);
    const b = add(new THREE.BoxGeometry(w, hgt, d), mat, CITY, [x, hgt / 2, z], null, null, false);
    buildings.push({ b, mat, dist: Math.hypot(x - 0, z + 380), base: 1.2 + r() * 0.9 });
  }
}
// nosso prédio (o último a apagar), perto da câmera
const ourF = facade(21, 6, 18, 0.7);
const ourMat = std({ map: ourF.map, emissiveMap: ourF.em, emissive: 0xffffff, emissiveIntensity: 1.8, roughness: 0.9 });
for (const tx of [ourF.map, ourF.em]) { tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(2, 4); }
add(new THREE.BoxGeometry(22, 70, 22), ourMat, CITY, [0, 35, 60], null, null, false);
const ourWin = add(new THREE.PlaneGeometry(2.2, 1.6), new THREE.MeshBasicMaterial({ color: new THREE.Color(3.2, 2.2, 1.2) }), CITY, [1.5, 26, 71.05], null, null, false);
// postes (pontos luminosos)
const lampPts = []; { const r = rng(5); for (let i = 0; i < 700; i++) { const along = r() < 0.5; const a = Math.round((r() - 0.5) * 18) * 34 + 17, b = (r() - 0.5) * 640 - 180; lampPts.push(along ? [a, b] : [b, a - 180]); } }
const lampGeo = new THREE.BufferGeometry(); lampGeo.setAttribute('position', new THREE.Float32BufferAttribute(lampPts.flatMap(([x, z]) => [x, 6, z]), 3));
lampGeo.setAttribute('color', new THREE.Float32BufferAttribute(lampPts.flatMap(() => [3, 2, 1]), 3));
const lampDot = ctex(32, 32, (g) => { const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, '#fff'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); });
const lamps = new THREE.Points(lampGeo, new THREE.PointsMaterial({ size: 4, map: lampDot, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
CITY.add(lamps);
const cityMoon = new THREE.DirectionalLight(0x8090c0, 0.35); cityMoon.position.set(-300, 400, -200); CITY.add(cityMoon);
CITY.add(new THREE.HemisphereLight(0x1a2240, 0x050505, 0.4));
// faíscas de transformador na frente da onda
const sparkMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(6, 7, 10) });
const spark = add(new THREE.SphereGeometry(2.5, 12, 8), sparkMat, CITY, [0, 8, 0], null, null, false);

// céu: gradiente + lua + estrelas (domo)
const skyTex = ctex(64, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#02030a'); gr.addColorStop(0.55, '#0a1024'); gr.addColorStop(0.75, '#1a1f36'); gr.addColorStop(1, '#2a2a3a'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
const sky = new THREE.Mesh(new THREE.SphereGeometry(2500, 32, 16), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false }));
scene.add(sky);
const moon = new THREE.Mesh(new THREE.SphereGeometry(40, 24, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 2.5, 2.8), fog: false }));
moon.position.set(-700, 900, -1600); scene.add(moon);
{ const r = rng(9), p = []; for (let i = 0; i < 900; i++) { const th = r() * Math.PI * 2, ph = r() * 1.2; p.push(Math.cos(th) * Math.sin(ph) * 2300, Math.cos(ph) * 2300, Math.sin(th) * Math.sin(ph) * 2300); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ size: 2.2, color: 0x9aa4c8, sizeAttenuation: false, fog: false }))); }

// ====================================================================
//  APARTAMENTO + PRÉDIO DA FRENTE
// ====================================================================
const APT = grp(scene, [0, 0, 0]);
const mPl = std({ map: TX.plaster, roughness: 0.95 });
const RX = 3.2, RZ = 3.0, RHt = 2.75;
add(new THREE.PlaneGeometry(RX * 2, RZ * 2), std({ map: TX.wood, roughness: 0.6 }), APT, [0, 0, 0], [-Math.PI / 2, 0, 0], null, false);
add(new THREE.PlaneGeometry(RX * 2, RZ * 2), std({ color: 0x6a6660, roughness: 1 }), APT, [0, RHt, 0], [Math.PI / 2, 0, 0], null, false);
add(new THREE.PlaneGeometry(RX * 2, RHt), mPl, APT, [0, RHt / 2, RZ], [0, Math.PI, 0]);
add(new THREE.PlaneGeometry(RZ * 2, RHt), mPl, APT, [-RX, RHt / 2, 0], [0, Math.PI / 2, 0]);
add(new THREE.PlaneGeometry(RZ * 2, RHt), mPl, APT, [RX, RHt / 2, 0], [0, -Math.PI / 2, 0]);
// parede da janela (z = -RZ) com vão x[-2,2] y[0.8,2.45]
const wx = 2.0, wy0 = 0.8, wy1 = 2.45;
add(new THREE.PlaneGeometry(RX - wx, RHt), mPl, APT, [-(RX + wx) / 2, RHt / 2, -RZ]);
add(new THREE.PlaneGeometry(RX - wx, RHt), mPl, APT, [(RX + wx) / 2, RHt / 2, -RZ]);
add(new THREE.PlaneGeometry(wx * 2, wy0), mPl, APT, [0, wy0 / 2, -RZ]);
add(new THREE.PlaneGeometry(wx * 2, RHt - wy1), mPl, APT, [0, (RHt + wy1) / 2, -RZ]);
const frameMat = std({ color: 0x2a2a2c, roughness: 0.5, metalness: 0.3 });
for (const x of [-wx, 0, wx]) add(new THREE.BoxGeometry(0.06, wy1 - wy0, 0.08), frameMat, APT, [x, (wy0 + wy1) / 2, -RZ]);
for (const y of [wy0, wy1]) add(new THREE.BoxGeometry(wx * 2 + 0.06, 0.06, 0.1), frameMat, APT, [0, y, -RZ]);
add(new THREE.BoxGeometry(wx * 2 + 0.3, 0.05, 0.25), std({ color: 0x8a8278, roughness: 0.7 }), APT, [0, wy0 - 0.02, -RZ + 0.1]);
const glass = add(new THREE.PlaneGeometry(wx * 2, wy1 - wy0), new THREE.MeshPhysicalMaterial({ color: 0x9ab0c8, roughness: 0.05, metalness: 0, transmission: 0, transparent: true, opacity: 0.08 }), APT, [0, (wy0 + wy1) / 2, -RZ - 0.01], null, null, false);
// cortinas
for (const s of [-1, 1]) { const c = add(new THREE.BoxGeometry(0.5, 2.3, 0.05), std({ color: 0x3a2a3a, roughness: 1 }), APT, [s * (wx + 0.22), 1.45, -RZ + 0.15]); c.geometry.translate(0, 0, 0); }
// rodapé, quadro, estante
add(new THREE.BoxGeometry(RX * 2, 0.1, 0.02), std({ color: 0x2a221c }), APT, [0, 0.05, RZ - 0.01]);
const shelf = grp(APT, [-RX + 0.22, 0, 1.0]);
add(new THREE.BoxGeometry(0.4, 2.0, 1.4), std({ color: 0x3a2a1e, roughness: 0.7 }), shelf, [0, 1.0, 0]);
{ const r = rng(31); for (let s = 0; s < 4; s++) for (let i = 0; i < 9; i++) add(new THREE.BoxGeometry(0.22, 0.24 + r() * 0.08, 0.05 + r() * 0.04), std({ color: new THREE.Color().setHSL(r(), 0.35, 0.25 + r() * 0.15), roughness: 0.8 }), shelf, [0.12, 0.35 + s * 0.48, -0.6 + i * 0.14]); }
add(new THREE.BoxGeometry(0.03, 0.6, 0.8), std({ color: 0x1a1612 }), APT, [RX - 0.02, 1.6, -1.2]);
add(new THREE.PlaneGeometry(0.7, 0.5), std({ color: 0x4a5a6a, roughness: 0.6 }), APT, [RX - 0.04, 1.6, -1.2], [0, -Math.PI / 2, 0]);
// tapete, sofá, mesa de centro
add(new THREE.PlaneGeometry(2.6, 1.9), std({ map: TX.rug, roughness: 1 }), APT, [0, 0.005, -0.3], [-Math.PI / 2, 0, 0], null, false);
const sofa = grp(APT, [0, 0, 1.4]);
const mFab = std({ map: TX.fabric, roughness: 1 });
add(new RoundedBoxGeometry(2.2, 0.42, 0.95, 4, 0.08), mFab, sofa, [0, 0.25, 0]);
add(new RoundedBoxGeometry(2.2, 0.55, 0.22, 4, 0.08), mFab, sofa, [0, 0.66, 0.38]);
for (const s of [-1, 1]) add(new RoundedBoxGeometry(0.22, 0.6, 0.95, 4, 0.08), mFab, sofa, [s * 1.1, 0.4, 0]);
for (const s of [-0.5, 0.5]) add(new RoundedBoxGeometry(1.0, 0.14, 0.75, 4, 0.06), mFab, sofa, [s, 0.52, -0.05]);
const table = grp(APT, [0, 0, -0.25]);
add(new RoundedBoxGeometry(1.2, 0.06, 0.7, 3, 0.02), std({ color: 0x3a2618, roughness: 0.35 }), table, [0, 0.44, 0]);
for (const [x, z] of [[-0.55, -0.3], [0.55, -0.3], [-0.55, 0.3], [0.55, 0.3]]) add(new THREE.CylinderGeometry(0.025, 0.02, 0.42, 10), std({ color: 0x2a1a10 }), table, [x, 0.21, z]);
// vela
const candle = grp(table, [-0.25, 0.47, 0.05]);
add(new THREE.CylinderGeometry(0.035, 0.038, 0.16, 20), std({ color: 0xe8e0d0, roughness: 0.4, emissive: 0x2a1408 }), candle, [0, 0.08, 0]);

function capsule(parent, len, r0, mat, pos = [0, 0, 0]) { // pendurada a partir da junta (vai para -y)

function makeHand(parent, s, mat, fingerLen = 1, nails = false) {
  const hand = grp(parent, [0, 0, 0]);
  add(new RoundedBoxGeometry(0.08, 0.09, 0.03, 3, 0.012), mat, hand, [0, -0.045, 0]);
  const fingers = [];
  for (let i = 0; i < 4; i++) {
    const base = grp(hand, [0.03 - i * 0.02, -0.09, 0]); base.rotation.z = (i - 1.5) * 0.06;
    const L = (0.045 - Math.abs(i - 1.2) * 0.006) * fingerLen;
    capsule(base, L, 0.0085, mat);
    const mid = grp(base, [0, -L - 0.004, 0]); capsule(mid, L * 0.85, 0.008, mat);
    fingers.push([base, mid]);

  return hand;
}

    c[n].sh.rotation.set(-2.4 + p * 0.5, 0, sg * (0.9 + 0.2 * c2)); c[n].el.rotation.set(-0.9 - Math.max(0, p) * 0.8, 0, 0);

  }
  if (t > M.shutdown && t < M.shutdown + 0.5) { // desligando (efeito tubo)
    const k = seg(t, M.shutdown, M.shutdown + 0.35);
    octx.fillStyle = '#fff'; const hh = lerp(OH, 6, Math.pow(k, 0.4)), ww = k < 0.7 ? OW : lerp(OW, 0, (k - 0.7) / 0.3);
    octx.globalAlpha = 1 - seg(t, M.shutdown + 0.35, M.shutdown + 0.5); octx.fillRect(OW / 2 - ww / 2, OH / 2 - hh / 2, ww, hh); octx.globalAlpha = 1;
  }
}

const SCENES = { hook: sceneHook, casa: sceneCasa, vizinho: sceneVizinho, celular: sceneCelular, porta: scenePorta, radio: sceneRadio, final: sceneFinal };
window.renderAt = (t) => {
  resetWorld();
  const s0 = TL.scenes.find((s) => t >= s.t0 && t < s.t1) || TL.scenes[TL.scenes.length - 1];
  SCENES[s0.name](t);
  grade.uniforms.uTime.value = (t * 37.13) % 100;
  composer.render();
  octx.fillStyle = '#000'; octx.fillRect(0, 0, OW, OH);
  octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = 'high';
  octx.drawImage(renderer.domElement, 0, 0, OW, OH);
  finalOverlay(t);
  drawSubs(t);
};
window.frameJPEG = (t) => { window.renderAt(t); return out.toDataURL('image/jpeg', 0.92); };
window.READY = true;
if (!window.RENDER_MODE) {
  const btn = document.createElement('button'); btn.id = 'play'; btn.textContent = '▶ ASSISTIR'; document.body.appendChild(btn);
  btn.onclick = () => { btn.remove(); const audio = new Audio('saida/audio.wav'); audio.play().catch(() => {}); const st = performance.now();
    const loop = () => { const t = audio.currentTime > 0 ? audio.currentTime : (performance.now() - st) / 1000; if (t < TL.duration) { window.renderAt(t); requestAnimationFrame(loop); } }; loop(); };
}
</script>
