<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Foto</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #out { display: block; height: 100vh; margin: 0 auto; }
  #play { position: fixed; inset: 0; margin: auto; width: 180px; height: 56px; font: bold 18px sans-serif; background: #b8860b; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
</style>
<script src="timeline.js"></script>
</head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script>
// ====================================================================
//  "A FOTO" — curta de mistério em ilustração 2D (canvas), 1080x1920
// ====================================================================
const TL = window.TL, M = TL.marks, SUB = TL.subs;
const W = 1080, H = 1920;
const out = document.getElementById('out'), ctx = out.getContext('2d');
const YELLOW = '#e8b21c', YELLOW_D = '#9a6a08';

// ---------- utilidades ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => { k = clamp(k); return k * k * (3 - 2 * k); };
const easeOut = (k) => 1 - Math.pow(1 - clamp(k), 3);
const seg01 = (t, a, b) => clamp((t - a) / (b - a));
function off(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h); return c; }
// fim de uma fala (para sincronizar efeitos com a voz)
const vEnd = (i) => SUB[i].t0 + (SUB[i].dur || 2);

// nuvens / neblina (fbm barato com várias oitavas ampliadas suavemente)
function fbm(w, h, seed, oct = 5, base = 3) {
  return off(w, h, (g) => {
    const r = rng(seed);
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    for (let o = 0; o < oct; o++) {
      const s = base * Math.pow(2, o);
      const small = off(s, Math.max(2, Math.round(s * h / w)), (q, sw, sh) => {
        const d = q.createImageData(sw, sh);
        for (let i = 0; i < sw * sh; i++) { const v = r() * 255; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; }
        q.putImageData(d, 0, 0);
      });
      g.globalAlpha = 0.55 / (o + 1); g.globalCompositeOperation = 'lighter'; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
      g.filter = `blur(${Math.max(1, w / s * 0.6)}px)`; g.drawImage(small, -w * 0.1, -h * 0.1, w * 1.2, h * 1.2); g.filter = 'none';
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  });
}
// pinta uma textura fbm com uma cor (vira máscara de alfa)
function tint(src, color, gamma = 1.6, gain = 1) {
  return off(src.width, src.height, (g, w, h) => {
    const s = src.getContext('2d').getImageData(0, 0, w, h), d = g.createImageData(w, h);
    const c = color.match(/\w\w/g).map((x) => parseInt(x, 16));
    for (let i = 0; i < w * h; i++) {
      const v = Math.pow(s.data[i * 4] / 255, gamma) * gain;
      d.data[i * 4] = c[0]; d.data[i * 4 + 1] = c[1]; d.data[i * 4 + 2] = c[2]; d.data[i * 4 + 3] = clamp(v) * 255;
    }
    g.putImageData(d, 0, 0);
  });
}
const N1 = fbm(512, 512, 11), N2 = fbm(512, 256, 23, 6, 4);
const GRAIN = [0, 1, 2, 3].map((k) => off(540, 960, (g, w, h) => {
  const d = g.createImageData(w, h), r = rng(100 + k);
  for (let i = 0; i < w * h; i++) { const v = 128 + (r() - 0.5) * 120; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; }
  g.putImageData(d, 0, 0);
}));
const VIG = off(W, H, (g) => {
  const v = g.createRadialGradient(W / 2, H * 0.48, H * 0.25, W / 2, H * 0.5, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.78)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
});

// ====================================================================
//  PERSONAGEM (silhueta ilustrada com capa de chuva amarela e luz de recorte)
// ====================================================================
// y = linha dos pés, s = altura em px. pose: stand | walk | kneel | back | turn | scared
function personPath(g, pose, ph) {
  const P = {};
  // proporções em unidades de altura (0 = pés, -1 = topo da cabeça)
  P.head = [0, -0.905, 0.066];
  let hipY = -0.47, lean = 0;
  let legs, arms;
  const sw = Math.sin(ph || 0);
  if (pose === 'walk') {
    legs = [[[-0.02, hipY], [0.03 + sw * 0.1, -0.24], [0.02 + sw * 0.17, 0]], [[0.02, hipY], [-0.02 - sw * 0.1, -0.24], [-0.04 - sw * 0.15, 0]]];
    arms = [[[-0.11, -0.8], [-0.13 - sw * 0.06, -0.62], [-0.12 - sw * 0.12, -0.48]], [[0.11, -0.8], [0.13 + sw * 0.06, -0.62], [0.12 + sw * 0.12, -0.48]]];
    lean = 0.03;
  } else if (pose === 'kneel') {
    hipY = -0.33;
    legs = [[[-0.03, hipY], [0.16, -0.31], [0.16, 0]], [[0.03, hipY], [-0.06, -0.02], [-0.3, 0]]];
    arms = [[[-0.1, -0.68], [-0.02, -0.52], [0.12, -0.56]], [[0.11, -0.68], [0.17, -0.52], [0.16, -0.58]]];
    P.head = [0.04, -0.775, 0.066]; lean = 0.08;
  } else if (pose === 'scared') {
    legs = [[[-0.03, hipY], [-0.07, -0.24], [-0.09, 0]], [[0.03, hipY], [0.06, -0.24], [0.1, 0]]];
    arms = [[[-0.11, -0.8], [-0.19, -0.7], [-0.13, -0.88]], [[0.11, -0.8], [0.19, -0.7], [0.13, -0.88]]];
  } else {
    legs = [[[-0.03, hipY], [-0.04, -0.24], [-0.05, 0]], [[0.03, hipY], [0.04, -0.24], [0.05, 0]]];
    arms = [[[-0.11, -0.8], [-0.14, -0.63], [-0.13, -0.47]], [[0.11, -0.8], [0.14, -0.63], [0.13, -0.47]]];
  }
  P.legs = legs; P.arms = arms; P.hipY = hipY; P.lean = lean;
  return P;
}
function drawPerson(g, x, y, s, o = {}) {
  const pose = o.pose || 'stand', P = personPath(g, pose, o.phase);
  const coat = o.coat || YELLOW, dark = o.dark || '#141018', skin = o.skin || '#e0b08c';
  g.save(); g.translate(x, y); g.scale(s * (o.flip ? -1 : 1), s); g.lineCap = 'round'; g.lineJoin = 'round';
  const body = (fillCoat, fillDark, fillSkin, dx = 0) => {
    g.save(); g.translate(dx, 0);
    // pernas
    g.strokeStyle = fillDark; g.lineWidth = 0.075;
    for (const L of P.legs) { g.beginPath(); g.moveTo(...L[0]); g.lineTo(...L[1]); g.lineTo(...L[2]); g.stroke(); }
    g.fillStyle = fillDark; for (const L of P.legs) { g.beginPath(); g.ellipse(L[2][0] + 0.03, L[2][1] - 0.01, 0.055, 0.022, 0, 0, 7); g.fill(); }
    // capa de chuva (corpo)
    const hy = P.hipY, top = pose === 'kneel' ? -0.71 : -0.83, bot = pose === 'kneel' ? -0.18 : hy + 0.1, lx = P.lean;
    g.fillStyle = fillCoat; g.beginPath();
    g.moveTo(-0.07 + lx, top - 0.01); g.quadraticCurveTo(-0.15 + lx, top + 0.01, -0.15 + lx * 0.5, top + 0.1);
    g.lineTo(-0.17, bot); g.quadraticCurveTo(0, bot + 0.03, 0.17, bot); g.lineTo(0.15 + lx * 0.5, top + 0.1);
    g.quadraticCurveTo(0.15 + lx, top + 0.01, 0.07 + lx, top - 0.01); g.closePath(); g.fill();
    // capuz caído nas costas
    g.beginPath(); g.ellipse(lx * 0.8, top + 0.02, 0.085, 0.035, 0, 0, 7); g.fill();
    // braços (mangas da capa)
    g.strokeStyle = fillCoat; g.lineWidth = 0.062;
    for (const A of P.arms) { g.beginPath(); g.moveTo(A[0][0] + lx, A[0][1]); g.lineTo(A[1][0] + lx, A[1][1]); g.lineTo(A[2][0] + lx, A[2][1]); g.stroke(); }
    g.fillStyle = fillSkin; for (const A of P.arms) { g.beginPath(); g.arc(A[2][0] + lx, A[2][1], 0.027, 0, 7); g.fill(); }
    // pescoço e cabeça
    g.fillStyle = fillSkin; g.fillRect(-0.025 + P.head[0], P.head[1] + 0.05, 0.05, 0.05);
    g.beginPath(); g.ellipse(P.head[0], P.head[1], P.head[2] * 0.9, P.head[2] * 1.08, 0, 0, 7); g.fill();
    g.restore();
  };
  // luz de recorte: desenha a silhueta na cor da luz e cobre deslocada
  if (o.rim) { body(o.rim, o.rim, o.rim, o.rimDir * 0.012 || 0.012); }
  body(coat, dark, skin);
  // sombreamento da capa (lado oposto à luz)
  const sh = g.createLinearGradient(-0.18, 0, 0.18, 0);
  const dir = o.rimDir || 1;
  sh.addColorStop(dir > 0 ? 0 : 1, 'rgba(0,0,0,0.55)'); sh.addColorStop(0.6, 'rgba(0,0,0,0.05)'); sh.addColorStop(dir > 0 ? 1 : 0, 'rgba(0,0,0,0)');
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = sh; g.fillRect(-0.3, -1.1, 0.6, 1.2); g.globalCompositeOperation = 'source-over';
  // cabelo / rosto
  const [hx, hy, hr] = P.head;
  g.fillStyle = '#2a1a12';
  if (pose === 'back') { g.beginPath(); g.ellipse(hx, hy - 0.005, hr * 0.95, hr * 1.1, 0, 0, 7); g.fill(); }
  else {
    g.beginPath(); g.ellipse(hx, hy - hr * 0.35, hr * 0.98, hr * 0.8, 0, Math.PI, 0); g.fill();
    g.fillRect(hx - hr * 0.95, hy - hr * 0.4, hr * 0.25, hr * 0.8);
    if (o.face !== false) {
      g.fillStyle = '#1a1010';
      const sc = pose === 'scared' ? 1.6 : 1;
      g.beginPath(); g.ellipse(hx - hr * 0.35, hy + hr * 0.05, 0.008 * sc, 0.011 * sc, 0, 0, 7); g.fill();
      g.beginPath(); g.ellipse(hx + hr * 0.35, hy + hr * 0.05, 0.008 * sc, 0.011 * sc, 0, 0, 7); g.fill();
      if (pose === 'scared') { g.beginPath(); g.ellipse(hx, hy + hr * 0.55, 0.015, 0.02, 0, 0, 7); g.fill(); }
    }
  }
  if (o.photo) { // segurando uma polaroid
    const A = P.arms[1][2]; g.fillStyle = '#f2ece0'; g.fillRect(A[0] - 0.05, A[1] - 0.07, 0.07, 0.085);
    g.fillStyle = '#1a2030'; g.fillRect(A[0] - 0.044, A[1] - 0.064, 0.058, 0.058);
  }
  g.restore();
}
// "O FOTÓGRAFO": alto, sobretudo preto, uma câmera antiga de fole no lugar da cabeça
function drawPhotographer(g, x, y, s, flashK = 0) {
  g.save(); g.translate(x, y); g.scale(s, s); g.lineCap = 'round';
  g.fillStyle = '#07060a';
  g.beginPath(); g.moveTo(-0.13, -0.84); g.lineTo(-0.2, -0.05); g.lineTo(-0.06, 0); g.lineTo(0.06, 0); g.lineTo(0.2, -0.05); g.lineTo(0.13, -0.84); g.closePath(); g.fill();
  g.strokeStyle = '#07060a'; g.lineWidth = 0.05;
  g.beginPath(); g.moveTo(-0.12, -0.8); g.lineTo(-0.17, -0.6); g.lineTo(-0.05, -0.86); g.stroke();
  g.beginPath(); g.moveTo(0.12, -0.8); g.lineTo(0.17, -0.6); g.lineTo(0.06, -0.86); g.stroke();
  // pescoço longo demais
  g.fillStyle = '#d8d0c8'; g.fillRect(-0.02, -0.92, 0.04, 0.1);
  // câmera de fole como cabeça
  g.fillStyle = '#16120e'; g.fillRect(-0.09, -1.04, 0.18, 0.13);
  g.fillStyle = '#2a2018'; for (let i = 0; i < 4; i++) g.fillRect(-0.075 + i * 0.006, -1.03 + i * 0.006, 0.15 - i * 0.012, 0.11 - i * 0.012);
  g.fillStyle = '#0a0a0a'; g.beginPath(); g.arc(0, -0.975, 0.045, 0, 7); g.fill();
  const lens = g.createRadialGradient(-0.012, -0.988, 0.002, 0, -0.975, 0.04);
  lens.addColorStop(0, flashK > 0 ? '#ffffff' : '#9ab0d8'); lens.addColorStop(0.3, '#20304a'); lens.addColorStop(1, '#000');
  g.fillStyle = lens; g.beginPath(); g.arc(0, -0.975, 0.035, 0, 7); g.fill();
  g.fillStyle = '#c8c8c8'; g.fillRect(0.05, -1.07, 0.04, 0.03);       // lâmpada do flash
  if (flashK > 0) { const fl = g.createRadialGradient(0.07, -1.06, 0, 0.07, -1.06, 0.4 * flashK); fl.addColorStop(0, 'rgba(255,255,240,1)'); fl.addColorStop(1, 'rgba(255,255,240,0)'); g.fillStyle = fl; g.fillRect(-0.4, -1.5, 0.9, 0.9); }
  g.restore();
}

// ====================================================================
//  FOTOS (cenas em miniatura, pintadas uma vez)
// ====================================================================
function photo(kind, seed) {
  return off(300, 300, (g, w, h) => {
    const r = rng(seed);
    const sky = (a, b) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, a); gr.addColorStop(1, b); g.fillStyle = gr; g.fillRect(0, 0, w, h); };
    if (kind === 'farol' || kind === 'farol2') {
      sky('#0a1430', '#2a3050');
      g.fillStyle = '#e8e4d0'; g.beginPath(); g.arc(230, 60, 18, 0, 7); g.fill();
      g.fillStyle = '#0a0c14'; g.beginPath(); g.moveTo(0, 220); g.lineTo(120, 190); g.lineTo(300, 210); g.lineTo(300, 300); g.lineTo(0, 300); g.fill();
      g.fillStyle = '#d8d4c8'; g.beginPath(); g.moveTo(140, 200); g.lineTo(150, 90); g.lineTo(170, 90); g.lineTo(180, 200); g.fill();
      g.fillStyle = '#a02020'; g.fillRect(146, 120, 30, 14); g.fillRect(143, 160, 34, 14);
      g.fillStyle = '#ffe9a0'; g.fillRect(150, 75, 20, 15);
      drawPerson(g, 110, 268, 70, { pose: kind === 'farol2' ? 'stand' : 'back', rim: '#8aa0d0', rimDir: 1 });
    } else if (kind === 'sono') {
      sky('#0c0e1a', '#181424');
      g.fillStyle = '#1e2a4a'; g.fillRect(200, 40, 70, 80); g.fillStyle = '#0c0e1a'; g.fillRect(233, 40, 4, 80);
      g.fillStyle = '#3a2a24'; g.fillRect(30, 180, 240, 80); g.fillStyle = '#5a4a6a'; g.fillRect(30, 165, 240, 40);
      g.fillStyle = '#d8d0c8'; g.fillRect(40, 150, 60, 25); g.fillStyle = '#e0b08c'; g.beginPath(); g.ellipse(80, 158, 20, 16, 0, 0, 7); g.fill();
      g.fillStyle = '#2a1a12'; g.beginPath(); g.ellipse(76, 150, 20, 11, 0, Math.PI, 0); g.fill();
      g.fillStyle = YELLOW; g.fillRect(250, 120, 20, 70);
    } else if (kind === 'escola') {
      sky('#4a5a4a', '#8a8070');
      g.fillStyle = '#1e3a2a'; g.fillRect(20, 30, 260, 90); g.strokeStyle = '#d8d8d0'; g.lineWidth = 2; g.beginPath(); g.moveTo(40, 60); g.lineTo(120, 60); g.moveTo(40, 80); g.lineTo(160, 80); g.stroke();
      g.fillStyle = '#7a5030'; g.fillRect(70, 210, 170, 14); g.fillRect(80, 224, 8, 60); g.fillRect(222, 224, 8, 60);
      drawPerson(g, 150, 290, 150, { pose: 'stand', rim: '#f0e0c0', rimDir: -1 });
      g.fillStyle = '#7a5030'; g.fillRect(60, 214, 190, 12);
    } else if (kind === 'celular') {
      sky('#05060c', '#0a0a14');
      g.fillStyle = '#20263a'; g.fillRect(20, 190, 260, 90);
      const glow = g.createRadialGradient(150, 160, 5, 150, 160, 120); glow.addColorStop(0, 'rgba(120,170,255,0.6)'); glow.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = glow; g.fillRect(0, 0, w, h);
      g.fillStyle = '#c8d8f0'; g.beginPath(); g.ellipse(150, 170, 26, 30, 0, 0, 7); g.fill();
      g.fillStyle = '#1a1010'; g.fillRect(138, 165, 6, 4); g.fillRect(156, 165, 6, 4);
      g.fillStyle = '#2a1a12'; g.beginPath(); g.ellipse(150, 155, 28, 20, 0, Math.PI, 0); g.fill();
      g.fillStyle = '#0a0a10'; g.fillRect(132, 205, 36, 60); g.fillStyle = '#9ac0ff'; g.fillRect(136, 209, 28, 50);
      g.fillStyle = YELLOW; g.fillRect(40, 215, 230, 55);
    } else if (kind === 'onibus') {
      sky('#101828', '#1a1a2a');
      for (let i = 0; i < 30; i++) { g.fillStyle = ['#ffcc60', '#ff6060', '#60c0ff'][i % 3]; g.globalAlpha = 0.6; g.beginPath(); g.arc(r() * w, 60 + r() * 120, 2 + r() * 6, 0, 7); g.fill(); }
      g.globalAlpha = 1; g.fillStyle = '#05050a'; g.fillRect(0, 0, w, 30); g.fillRect(0, 220, w, 80); g.fillRect(0, 0, 25, h);
      drawPerson(g, 200, 380, 260, { pose: 'stand', rim: '#ffcc80', rimDir: -1 });
    } else if (kind === 'rua') {
      sky('#0a0a14', '#1a1418');
      g.fillStyle = '#2a2a2a'; g.fillRect(150, 30, 6, 230);
      const lamp = g.createRadialGradient(153, 40, 2, 153, 120, 140); lamp.addColorStop(0, 'rgba(255,200,120,0.8)'); lamp.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = lamp; g.fillRect(0, 0, w, h);
      g.fillStyle = '#141418'; g.fillRect(0, 250, w, 50);
      drawPerson(g, 110, 262, 110, { pose: 'walk', phase: 1, rim: '#ffc880', rimDir: 1 });
    } else if (kind === 'praia') {
      sky('#d89a60', '#5a7090');
      g.fillStyle = '#ffd890'; g.beginPath(); g.arc(150, 150, 30, 0, 7); g.fill();
      g.fillStyle = '#3a5a80'; g.fillRect(0, 160, w, 60); g.fillStyle = '#c8a878'; g.fillRect(0, 220, w, 80);
      drawPerson(g, 90, 280, 100, { pose: 'back', rim: '#ffd8a0', rimDir: 1 });
    } else if (kind === 'costas' || kind === 'costasAgora') {
      // você, de costas, olhando uma parede cheia de fotos (a última foto)
      sky('#1a120c', '#0a0806');
      for (let y = 20; y < 230; y += 34) for (let x = 10 + (y % 68 ? 0 : 14); x < 290; x += 30) { g.fillStyle = '#e8e0d0'; g.save(); g.translate(x, y); g.rotate((r() - 0.5) * 0.3); g.fillRect(-11, -13, 22, 26); g.fillStyle = '#2a2a34'; g.fillRect(-9, -11, 18, 17); g.restore(); }
      const lamp = g.createRadialGradient(150, 130, 10, 150, 150, 170); lamp.addColorStop(0, 'rgba(255,190,110,0.35)'); lamp.addColorStop(1, 'rgba(0,0,0,0.5)'); g.fillStyle = lamp; g.fillRect(0, 0, w, h);
      drawPerson(g, 150, 420, 330, { pose: 'back', rim: '#ffcc80', rimDir: -1, face: false });
    }
    // envelhecimento: viragem de cor, vazamento de luz, grão
    g.globalCompositeOperation = 'soft-light'; g.fillStyle = 'rgba(255,200,120,0.35)'; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'source-over';
    const lk = g.createRadialGradient(w, 0, 0, w, 0, 180); lk.addColorStop(0, 'rgba(255,120,60,0.25)'); lk.addColorStop(1, 'rgba(255,120,60,0)'); g.fillStyle = lk; g.fillRect(0, 0, w, h);
    const d = g.getImageData(0, 0, w, h); for (let i = 0; i < d.data.length; i += 4) { const n = (r() - 0.5) * 22; d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n; } g.putImageData(d, 0, 0);
    const v = g.createRadialGradient(w / 2, h / 2, w * 0.3, w / 2, h / 2, w * 0.75); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
  });
}
function polaroid(ph, caption, capColor = '#2a2a6a', seed = 1) {
  return off(340, 410, (g, w, h) => {
    const r = rng(seed);
    g.fillStyle = '#efe9dc'; g.fillRect(0, 0, w, h);
    const yel = g.createLinearGradient(0, 0, w, h); yel.addColorStop(0, 'rgba(200,170,110,0.15)'); yel.addColorStop(1, 'rgba(120,90,50,0.3)'); g.fillStyle = yel; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(120,100,70,${r() * 0.12})`; g.beginPath(); g.arc(r() * w, r() * h, r() * 6, 0, 7); g.fill(); }

    for (const off2 of [0, Math.PI]) {
      const a = beamA + off2, len = 2400, spread = 0.13, c = Math.cos(a);
      const gr = ctx.createRadialGradient(lx, ly, 0, lx, ly, len); gr.addColorStop(0, `rgba(255,240,190,${0.9 * (0.4 + 0.6 * Math.abs(Math.sin(a)))})`); gr.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(lx, ly);
      ctx.lineTo(lx + Math.cos(a - spread) * len * Math.abs(c) + Math.cos(a) * 30, ly + Math.sin(a - spread) * 120);
      ctx.lineTo(lx + Math.cos(a + spread) * len * Math.abs(c) + Math.cos(a) * 30, ly + Math.sin(a + spread) * 120);
      ctx.fill();
    }
    const face = Math.max(0, Math.sin(beamA)); // feixe virado pra câmera = clarão
    lampLight(lx, ly, 120 + 500 * Math.pow(face, 6), '255,240,200', 0.7 + 0.3 * face);
    ctx.globalCompositeOperation = 'source-over';
  }
}
function sea(t, horizon, bright = 1) {
  const gr = ctx.createLinearGradient(0, horizon, 0, H); gr.addColorStop(0, '#1a2038'); gr.addColorStop(1, '#03040a'); ctx.fillStyle = gr; ctx.fillRect(0, horizon, W, H - horizon);
  for (let i = 0; i < 34; i++) {
    const y = horizon + Math.pow(i / 34, 1.8) * (H - horizon), amp = 2 + i * 0.9, fr = 0.02 - i * 0.0004;
    ctx.strokeStyle = `rgba(150,170,230,${(0.08 + 0.12 * (1 - i / 34)) * bright})`; ctx.lineWidth = 1 + i * 0.12;
    ctx.beginPath(); for (let x = 0; x <= W; x += 24) { const yy = y + Math.sin(x * fr + t * (0.8 + i * 0.05) + i * 1.7) * amp; x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); } ctx.stroke();
  }
  // reflexo da lua tremendo
  for (let i = 0; i < 40; i++) { const y = horizon + 10 + i * 18, w = 80 - i + Math.sin(t * 3 + i) * 30; ctx.fillStyle = `rgba(220,226,255,${0.35 * (1 - i / 40) * bright})`; ctx.fillRect(780 - w / 2 + Math.sin(t * 2 + i * 1.3) * 20, y, w, 3); }
}
function sceneFarol(t, f) {
  const onT = vEnd(8) - 0.75, on = t > onT;
  const beamA = (t - onT) * 1.15 - 1.2;
  const lightning = [22.4, 25.9].some((x) => t > x && t < x + 0.18) && !(t > 22.47 && t < 22.53);
  if (t < M.cliff) {
    const k = ease(seg01(t, M.coast, M.cliff));
    ctx.save(); cam(lerp(1.0, 1.08, k), W / 2, H * 0.55, 0, 0);
    ctx.drawImage(SEA_SKY, 0, 0);
    const cx = (t * 22) % W;
    ctx.globalAlpha = 0.55; ctx.drawImage(CLOUDS, -cx, 0, W, H * 0.45); ctx.drawImage(CLOUDS, W - cx, 0, W, H * 0.45);
    ctx.globalAlpha = 0.9; ctx.drawImage(CLOUDS_D, -cx * 1.6 % W, -100, W * 1.2, H * 0.4); ctx.drawImage(CLOUDS_D, W - (cx * 1.6 % W), -100, W * 1.2, H * 0.4); ctx.globalAlpha = 1;
    if (lightning) { ctx.fillStyle = 'rgba(200,210,255,0.5)'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#f0f4ff'; ctx.lineWidth = 5; ctx.beginPath(); let x = 240, y = 0; ctx.moveTo(x, y); const r = rng(Math.floor(t)); while (y < 900) { x += (r() - 0.5) * 90; y += 40 + r() * 50; ctx.lineTo(x, y); } ctx.stroke(); }
    sea(t, 1060);
    // ponta do penhasco com o farol
    ctx.fillStyle = '#06070c'; ctx.beginPath(); ctx.moveTo(560, 1090); ctx.quadraticCurveTo(700, 1000, 760, 1010); ctx.quadraticCurveTo(860, 1000, 960, 1060); ctx.lineTo(1000, 1100); ctx.lineTo(560, 1100); ctx.fill();
    lighthouse(800, 1018, 1.0, on, beamA, t);
    ctx.drawImage(CLIFF, 0, 0);
    ctx.globalAlpha = 0.25; ctx.drawImage(FOG, -(t * 30 % W), 950, W, 300); ctx.drawImage(FOG, W - (t * 30 % W), 950, W, 300); ctx.globalAlpha = 1;
    rain(t, 0.32);
    ctx.restore();
    finish(t, f, { grade: 'rgba(80,100,200,0.18)', flash: lightning ? 0.25 : 0, bloom: 0.45 });
  } else {
    // você subindo a trilha do penhasco até o farol
    const k = seg01(t, M.cliff, 36);
    ctx.drawImage(SEA_SKY, 0, -200, W, H);
    const cx = (t * 22) % W; ctx.globalAlpha = 0.6; ctx.drawImage(CLOUDS, -cx, 0, W, H * 0.4); ctx.drawImage(CLOUDS, W - cx, 0, W, H * 0.4); ctx.globalAlpha = 1;
    sea(t, 1250, 0.8);
    ctx.fillStyle = '#07080d'; ctx.beginPath(); ctx.moveTo(0, 1350); ctx.quadraticCurveTo(500, 1180, 1080, 1120); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    lighthouse(780, 1150, 2.2, true, beamA, t);
    ctx.strokeStyle = '#1a1c24'; ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(80, H); ctx.quadraticCurveTo(420, 1500, 700, 1170); ctx.stroke();
    const px = lerp(260, 560, k), py = lerp(1700, 1330, k);
    drawPerson(ctx, px, py, lerp(420, 300, k), { pose: 'walk', phase: t * 5, rim: '#fff0c0', rimDir: 1 });
    ctx.globalAlpha = 0.3; ctx.drawImage(FOG, -(t * 40 % W), 1300, W, 400); ctx.drawImage(FOG, W - (t * 40 % W), 1300, W, 400); ctx.globalAlpha = 1;
    rain(t, 0.4);
    finish(t, f, { grade: 'rgba(80,100,200,0.18)', bloom: 0.45 });
  }
}

// paredes de tijolo curvas (interior do farol)
const BRICK = off(512, 512, (g, w, h) => {
  g.fillStyle = '#1a120e'; g.fillRect(0, 0, w, h); const r = rng(61);
  for (let y = 0; y < h; y += 32) for (let x = (y / 32) % 2 ? -32 : 0; x < w; x += 64) { const c = 60 + r() * 40; g.fillStyle = `rgb(${c + 30},${c * 0.6},${c * 0.45})`; g.fillRect(x + 2, y + 2, 60, 28); g.fillStyle = 'rgba(0,0,0,0.2)'; g.fillRect(x + 2, y + 22, 60, 8); }
});
function sceneEscada(t, f) {
  if (t < M.stairs) {
    // a porta entreaberta, luz quente vazando
    const k = ease(seg01(t, M.door, M.stairs));
    ctx.save(); cam(lerp(1.0, 1.25, k), W / 2, H * 0.55);
    ctx.fillStyle = '#0a0b10'; ctx.fillRect(0, 0, W, H);
    const wall = ctx.createLinearGradient(0, 0, W, 0); wall.addColorStop(0, '#2a2a30'); wall.addColorStop(0.5, '#4a4a52'); wall.addColorStop(1, '#202026'); ctx.fillStyle = wall; ctx.fillRect(140, 0, 800, 1500);
    ctx.globalAlpha = 0.4; ctx.drawImage(BRICK, 140, 0, 800, 1500); ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffcf80'; ctx.fillRect(400, 640, 280, 760);
    const spill = ctx.createLinearGradient(0, 1400, 0, H); spill.addColorStop(0, 'rgba(255,190,100,0.6)'); spill.addColorStop(1, 'rgba(255,190,100,0)');
    ctx.fillStyle = spill; ctx.beginPath(); ctx.moveTo(400, 1400); ctx.lineTo(680, 1400); ctx.lineTo(900, H); ctx.lineTo(200, H); ctx.fill();
    ctx.fillStyle = '#3a2412'; ctx.beginPath(); ctx.moveTo(400, 640); ctx.lineTo(560, 600); ctx.lineTo(560, 1440); ctx.lineTo(400, 1400); ctx.fill();
    ctx.fillStyle = '#1a1010'; ctx.fillRect(536, 1000, 14, 30);
    ctx.fillStyle = '#05060a'; ctx.fillRect(0, 1400, W, 600);
    drawPerson(ctx, lerp(560, 600, k), lerp(1900, 1700, k), lerp(900, 820, k), { pose: 'back', rim: '#ffcf80', rimDir: 1, face: false, dark: '#0a0a10' });
    rain(t, 0.25);
    ctx.restore();
    finish(t, f, { grade: 'rgba(255,170,90,0.12)', bloom: 0.5 });
  } else {
    // olhando pra cima: a escada em espiral, e as paredes cobertas de fotos
    const k = seg01(t, M.stairs, 52), rot = t * 0.22;
    const cx = W / 2 + Math.sin(t * 0.3) * 20, cy = H * 0.42;
    ctx.fillStyle = '#0c0806'; ctx.fillRect(0, 0, W, H);
    const nPhotos = Math.floor(lerp(30, 260, ease(seg01(t, M.stairs + 0.5, 47))));
    const N = 70, r0 = 1250;
    // anéis de parede (de cima/longe para perto)
    for (let i = N; i >= 0; i--) {
      const rr = r0 * Math.pow(0.955, i + k * 6), a = i * 0.42 + rot;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
      const shade = 0.12 + 0.88 * Math.pow(0.955, i);
      ctx.fillStyle = `rgb(${38 * shade + 6},${22 * shade + 3},${16 * shade + 2})`;
      ctx.beginPath(); ctx.arc(0, 0, rr * 1.18, 0, 0.45); ctx.arc(0, 0, rr, 0.45, 0, true); ctx.fill();
      // degrau
      ctx.fillStyle = `rgb(${150 * shade + 10},${105 * shade + 6},${66 * shade + 4})`;
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, 0.42); ctx.arc(0, 0, rr * 0.42, 0.42, 0, true); ctx.fill();
      ctx.strokeStyle = `rgba(255,210,150,${0.5 * shade})`; ctx.lineWidth = Math.max(1, rr * 0.012); ctx.beginPath(); ctx.moveTo(rr * 0.42, 0); ctx.lineTo(rr, 0); ctx.stroke();
      ctx.fillStyle = `rgba(0,0,0,0.5)`; ctx.beginPath(); ctx.arc(0, 0, rr, 0.38, 0.42); ctx.arc(0, 0, rr * 0.42, 0.42, 0.38, true); ctx.fill();
      // fotos presas na parede
      if (i < nPhotos / 3.5) for (let j = 0; j < 3; j++) {
        const pa = 0.08 + j * 0.13, pr = rr * 1.09, sz = rr * 0.075;
        ctx.save(); ctx.rotate(pa); ctx.translate(pr, 0); ctx.rotate(Math.PI / 2 + Math.sin(i * 7 + j) * 0.2);
        ctx.fillStyle = `rgba(235,228,212,${shade})`; ctx.fillRect(-sz / 2, -sz * 0.6, sz, sz * 1.2);
        ctx.fillStyle = `rgba(40,40,52,${shade})`; ctx.fillRect(-sz * 0.42, -sz * 0.5, sz * 0.84, sz * 0.8);
        ctx.restore();
      }
      ctx.restore();
    }
    // coluna central e luz da lanterna lá em cima
    ctx.fillStyle = '#050303'; ctx.beginPath(); ctx.arc(cx, cy, 38, 0, 7); ctx.fill();
    lampLight(cx, cy, 700, '255,180,90', 0.5);
    lampLight(cx + 300, cy + 500, 600, '255,170,80', 0.35);
    dust(t, 0.45, '255,220,170');
    finish(t, f, { grade: 'rgba(255,160,80,0.15)', bloom: 0.45 });
  }
}

// mural de fotos (gerado uma vez): tijolos + grade de polaroids + barbantes vermelhos
const WALL_W = 2200, WALL_H = 3400;
const WALLPOS = [];
const WALL = off(WALL_W, WALL_H, (g) => {
  g.fillStyle = '#140c08'; g.fillRect(0, 0, WALL_W, WALL_H);
  for (let y = 0; y < WALL_H; y += 512) for (let x = 0; x < WALL_W; x += 512) { g.globalAlpha = 0.7; g.drawImage(BRICK, x, y); } g.globalAlpha = 1;
  const r = rng(71);
  for (let row = 0; row < 9; row++) for (let col = 0; col < 7; col++) {
    const x = 170 + col * 300 + (r() - 0.5) * 60, y = 220 + row * 360 + (r() - 0.5) * 60, rot = (r() - 0.5) * 0.3;
    const name = POL_LIST[(row * 7 + col + Math.floor(r() * 3)) % POL_LIST.length];
    WALLPOS.push([x, y, rot, name]);
    g.save(); g.translate(x, y); g.rotate(rot); g.shadowColor = 'rgba(0,0,0,0.7)'; g.shadowBlur = 20; g.shadowOffsetY = 10;
    g.drawImage(POL[name], -120, -145, 240, 290); g.restore();
    g.fillStyle = '#a01010'; g.beginPath(); g.arc(x, y - 132, 9, 0, 7); g.fill();
  }
  g.strokeStyle = 'rgba(170,20,20,0.85)'; g.lineWidth = 4;
  for (let i = 0; i < 18; i++) { const a = WALLPOS[Math.floor(r() * WALLPOS.length)], b = WALLPOS[Math.floor(r() * WALLPOS.length)]; g.beginPath(); g.moveTo(a[0], a[1] - 132); g.quadraticCurveTo((a[0] + b[0]) / 2, Math.max(a[1], b[1]) - 60, b[0], b[1] - 132); g.stroke(); }
});
function flashlight(x, y, rad) {
  // escurece tudo fora do círculo da lanterna
  const g = ctx.createRadialGradient(x, y, rad * 0.3, x, y, rad); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.88)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  lampLight(x, y, rad * 0.8, '255,210,150', 0.18);
}
function sceneParede(t, f) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // closes em fotos específicas: dormindo, escola, celular (você vendo este vídeo)
  const s14 = SUB[14].t0;
  const focus = [[52, 'pan'], [s14, 'sono'], [s14 + 1.6, 'escola'], [s14 + 3.0, 'celular'], [SUB[15].t0, 'pan2']];
  let cur = focus[0]; for (const fc of focus) if (t >= fc[0]) cur = fc;
  if (cur[1] === 'pan' || cur[1] === 'pan2') {
    const k = ease(seg01(t, cur[0], cur[1] === 'pan' ? s14 : 68));
    const sc = cur[1] === 'pan' ? lerp(0.75, 0.62, k) : lerp(0.5, 0.42, k);
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(sc, sc);
    ctx.translate(-lerp(cur[1] === 'pan' ? 900 : 1300, cur[1] === 'pan' ? 1200 : 800, k), -lerp(cur[1] === 'pan' ? 1100 : 1900, cur[1] === 'pan' ? 1500 : 1500, k));
    ctx.drawImage(WALL, 0, 0); ctx.restore();
    flashlight(W / 2 + Math.sin(t * 0.8) * 180, H * 0.45 + Math.cos(t * 0.6) * 160, 760);
  } else {
    const k = ease(seg01(t, cur[0], cur[0] + 1.5));
    ctx.save(); cam(1.0 + k * 0.08); ctx.drawImage(WALL, 300, 400, 1500, 2700, -200, -200, W + 400, H + 400); ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    drawPol(POL[cur[1]], W / 2, H * 0.47, lerp(760, 860, k), cur[1] === 'celular' ? 0.02 : -0.04);
    flashlight(W / 2, H * 0.45, 900);
  }
  dust(t, 0.35, '255,220,170');
  finish(t, f, { grade: 'rgba(255,160,80,0.12)', bloom: 0.35 });
}

function sceneUltima(t, f) {
  ctx.fillStyle = '#060404'; ctx.fillRect(0, 0, W, H);
  const k = ease(seg01(t, M.last, 80.3));
  ctx.save(); cam(lerp(1.0, 1.9, Math.pow(k, 1.4)), W / 2, H * lerp(0.45, 0.62, k));
  // parede de madeira no topo da escada
  ctx.globalAlpha = 0.5; ctx.drawImage(WOOD, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
  drawPol(POL.costas, W / 2, H * 0.47, 620, 0.04);
  ctx.fillStyle = '#a01010'; ctx.beginPath(); ctx.arc(W / 2 + 10, H * 0.47 - 350, 14, 0, 7); ctx.fill();
  ctx.restore();
  flashlight(W / 2 + Math.sin(t * 1.3) * 40, H * 0.5, lerp(700, 900, k));
  // o "AGORA" pulsa em vermelho
  const agora = t > SUB[18].t0 + 1.2;
  if (agora) lampLight(W / 2, H * 0.62 + 300 * k, 260, '255,40,40', 0.25 + 0.15 * Math.sin(t * 8));
  finish(t, f, { grade: 'rgba(255,160,80,0.12)', bloom: 0.4 });
}

function sceneFlash(t, f) {
  const fl = t - M.flash;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (t > M.develop) {
    // a foto que acabaram de tirar, revelando: você se virando... e ELE atrás
    const dev = ease(seg01(t, M.develop + 0.3, M.develop + 3.5));
    const k = ease(seg01(t, M.develop, M.end));
    const ph = off(300, 300, (g) => {
      g.fillStyle = '#1a120c'; g.fillRect(0, 0, 300, 300);
      for (let y = 20; y < 200; y += 34) for (let x = 10; x < 290; x += 30) { g.fillStyle = '#d8d0c0'; g.fillRect(x - 10, y - 12, 20, 24); g.fillStyle = '#2a2a34'; g.fillRect(x - 8, y - 10, 16, 16); }
      const fx = g.createRadialGradient(70, 40, 10, 150, 150, 300); fx.addColorStop(0, 'rgba(255,255,240,0.6)'); fx.addColorStop(1, 'rgba(0,0,0,0.3)'); g.fillStyle = fx; g.fillRect(0, 0, 300, 300);
      const halo = g.createRadialGradient(80, 60, 5, 80, 120, 170); halo.addColorStop(0, 'rgba(255,255,235,0.75)'); halo.addColorStop(1, 'rgba(255,255,235,0)'); g.fillStyle = halo; g.fillRect(0, 0, 300, 300);
      drawPhotographer(g, 78, 345, 300, 1.6);
      drawPerson(g, 185, 420, 330, { pose: 'scared', rim: '#ffffff', rimDir: -1 });
      g.globalCompositeOperation = 'soft-light'; g.fillStyle = 'rgba(255,200,120,0.4)'; g.fillRect(0, 0, 300, 300); g.globalCompositeOperation = 'source-over';
    });
    const pol = polaroid(ph, '', '#000', 99);
    ctx.save(); cam(lerp(1.0, 1.35, k), W / 2, H * lerp(0.47, 0.4, k));
    const slide = easeOut(seg01(t, M.develop, M.develop + 0.8));
    drawPol(pol, W / 2, lerp(H * 1.3, H * 0.47, slide), 840, -0.02);
    // revelação: cobre a imagem com cinza que some
    ctx.fillStyle = `rgba(40,44,40,${1 - dev})`;
    ctx.save(); ctx.translate(W / 2, lerp(H * 1.3, H * 0.47, slide)); ctx.rotate(-0.02); ctx.fillRect(-370, -456, 740, 740); ctx.restore();
    ctx.restore();
  }
  const na = t > M.naoOlhe && t < M.naoOlhe + 0.12;
  finish(t, f, { flash: fl < 0.7 ? 1 - fl / 0.7 : (na ? 0.5 : 0), bloom: 0.4, black: t >= M.end ? 1 : 0, grade: 'rgba(255,160,80,0.08)' });
}

const SCENES = { hook: sceneHook, sotao: sceneSotao, farol: sceneFarol, escada: sceneEscada, parede: sceneParede, ultima: sceneUltima, flash: sceneFlash };
window.renderAt = (t) => {
  const f = Math.round(t * TL.fps);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  const s0 = TL.scenes.find((s) => t >= s.t0 && t < s.t1) || TL.scenes[TL.scenes.length - 1];
  SCENES[s0.name](t, f);
};
window.frameJPEG = (t) => { window.renderAt(t); return out.toDataURL('image/jpeg', 0.9); };
window.READY = true;
if (!window.RENDER_MODE) {
  const btn = document.createElement('button'); btn.id = 'play'; btn.textContent = '▶ ASSISTIR'; document.body.appendChild(btn);
  window.renderAt(1.5);
  btn.onclick = () => {
    btn.remove(); const audio = new Audio('saida/audio.wav'); audio.play().catch(() => {});
    const start = performance.now();
    const loop = () => { const t = audio.currentTime > 0 ? audio.currentTime : (performance.now() - start) / 1000; if (t < TL.duration) { window.renderAt(t); requestAnimationFrame(loop); } };
    loop();
  };
}
