<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }

<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ====================================================================
//  "APAGÃO" — 3D com luz física, sombras, bloom e grade de cor
// ====================================================================
const TL = window.TL, M = TL.marks, SUB = TL.subs;
const RW = 720, RH = 1280, OW = 1080, OH = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(RW, RH, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, RW / RH, 0.02, 3000);

const rt = new THREE.WebGLRenderTarget(RW, RH, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(RW, RH), 0.8, 0.5, 1.0); composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVig: { value: 1.0 }, uGrain: { value: 0.05 }, uCA: { value: 0.0015 }, uTint: { value: new THREE.Vector3(1, 1, 1) }, uFlash: { value: 0 }, uBlack: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uVig, uGrain, uCA, uFlash, uBlack; uniform vec3 uTint; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec2 c = vUv - 0.5; float d = length(c * vec2(0.75, 1.0));
      vec3 col; col.r = texture2D(tDiffuse, vUv + c * uCA * 2.0).r; col.g = texture2D(tDiffuse, vUv).g; col.b = texture2D(tDiffuse, vUv - c * uCA * 2.0).b;
      col *= uTint;
      float bay = h(floor(vUv * vec2(360.0, 640.0)));
      col = floor(col * 40.0 + bay) / 40.0;   // redução sutil de cores com pontilhado (toque de PS2)
      col *= mix(1.0, smoothstep(0.85, 0.25, d), uVig);
      col += (h(vUv * 1000.0 + uTime) - 0.5) * uGrain * (0.4 + col);
      col = mix(col, vec3(4.0), uFlash); col *= (1.0 - uBlack);
      gl_FragColor = vec4(col, 1.0);
    }`,
});
composer.addPass(grade); composer.addPass(new OutputPass());

// ---------- utilidades ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => { k = clamp(k); return k * k * (3 - 2 * k); };
const easeOut = (k) => 1 - Math.pow(1 - clamp(k), 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const noise1 = (t, s = 0) => Math.sin(t * 1.7 + s) * 0.5 + Math.sin(t * 2.9 + s * 3.1) * 0.3 + Math.sin(t * 5.3 + s * 1.7) * 0.2;
function ctex(w, h, draw, rep, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t;
}
function speckle(g, w, h, base, amt, seed, n = 4000) {
  g.fillStyle = base; g.fillRect(0, 0, w, h); const r = rng(seed);
  for (let i = 0; i < n; i++) { const v = (r() - 0.5) * amt; g.fillStyle = v > 0 ? `rgba(255,255,255,${v})` : `rgba(0,0,0,${-v})`; g.fillRect(r() * w, r() * h, 1 + r() * 3, 1 + r() * 3); }
}
const std = (o) => new THREE.MeshStandardMaterial(o);
function add(geo, mat, parent, pos, rot, scale, shadow = true) {
  const m = new THREE.Mesh(geo, mat); if (pos) m.position.set(...pos); if (rot) m.rotation.set(...rot); if (scale) m.scale.set(...scale);
  m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
const grp = (parent, pos = [0, 0, 0]) => { const g = new THREE.Group(); g.position.set(...pos); parent.add(g); return g; };

// ====================================================================
//  SAÍDA 2D (imagem 3D ampliada + legendas nítidas em 1080x1920)
// ====================================================================
const out = document.getElementById('out'), octx = out.getContext('2d');
function wrap(text, maxW) { const words = text.split(' '), lines = []; let cur = ''; for (const w of words) { const s = cur ? cur + ' ' + w : w; if (octx.measureText(s).width > maxW && cur) { lines.push(cur); cur = w; } else cur = s; } if (cur) lines.push(cur); return lines; }
function drawSubs(t) {
  for (const s of SUB) {
    if (t < s.t0 || t > s.t1) continue;
    const n = Math.floor((t - s.t0) * (s.cps || 30)), alpha = clamp((s.t1 - t) / 0.2) * clamp((t - s.t0) / 0.06);
    const big = s.kind === 'big', size = big ? 88 : 62;
    const fam = '"Liberation Sans", Arial, sans-serif';
    octx.font = `${s.kind === 'crowd' ? 'italic 700' : '900'} ${size}px ${fam}`; octx.textBaseline = 'middle'; octx.textAlign = 'left';
    const lines = wrap(s.text, 940), lh = size * 1.18;
    let y0 = (big ? OH * 0.2 : OH * 0.71) - (lines.length - 1) * lh / 2, shown = 0;
    octx.globalAlpha = alpha;
    for (const line of lines) {
      let x = OW / 2 - octx.measureText(line).width / 2;
      for (const word of line.split(' ')) {
        const vis = word.slice(0, Math.max(0, n - shown)); shown += word.length + 1;
        if (vis) {
          const hot = big || (word.replace(/[^A-ZÇÃÉÍÓÚÂÊÔ]/g, '').length >= 3 && word === word.toUpperCase());
          octx.lineWidth = 14; octx.lineJoin = 'round'; octx.strokeStyle = 'rgba(0,0,0,0.92)'; octx.strokeText(vis, x, y0);
          octx.fillStyle = hot ? '#ff3b2a' : s.kind === 'alert' ? '#ffd23a' : s.kind === 'crowd' ? '#c8d8ff' : '#ffffff'; octx.fillText(vis, x, y0);
        }
        x += octx.measureText(word + ' ').width;
      }
      y0 += lh;
    }
    octx.globalAlpha = 1;
  }
}

function capsule(parent, len, r0, mat, pos = [0, 0, 0]) { // pendurada a partir da junta (vai para -y)
  const g = new THREE.CapsuleGeometry(r0, len, 6, 14); g.translate(0, -len / 2, 0); return add(g, mat, parent, pos);
}
function makeHand(parent, s, mat, fingerLen = 1, nails = false) {
  const hand = grp(parent, [0, 0, 0]);
  add(new RoundedBoxGeometry(0.08, 0.09, 0.03, 3, 0.012), mat, hand, [0, -0.045, 0]);
  const fingers = [];
  for (let i = 0; i < 4; i++) {
    const base = grp(hand, [0.03 - i * 0.02, -0.09, 0]); base.rotation.z = (i - 1.5) * 0.06;
    const L = (0.045 - Math.abs(i - 1.2) * 0.006) * fingerLen;
    capsule(base, L, 0.0085, mat);
    const mid = grp(base, [0, -L - 0.004, 0]); capsule(mid, L * 0.85, 0.008, mat);
    fingers.push([base, mid]);
  }
  const th = grp(hand, [-0.04 * s, -0.035, 0.015]); th.rotation.set(0.6, 0, 0.7 * s); capsule(th, 0.04 * fingerLen, 0.01, mat);
  hand.userData.fingers = fingers; hand.userData.thumb = th;
  return hand;
}
function curl(hand, a) { for (const [b, m] of hand.userData.fingers) { b.rotation.x = -a * 0.9; m.rotation.x = -a * 1.2; } hand.userData.thumb.rotation.x = 0.6 + a * 0.5; }
function makeHuman() {
  const skin = std({ color: 0xc89878, roughness: 0.55 }), hoodie = std({ map: TX.hoodie, roughness: 0.95 }), jeans = std({ map: TX.jeans, roughness: 0.9 });
  const root = grp(WORLD); const k = { root, skin };
  const hips = grp(root, [0, 0.95, 0]); k.hips = hips;
  add(new THREE.SphereGeometry(0.17, 20, 14), jeans, hips, [0, 0, 0], null, [1.05, 0.65, 0.75]);
  for (const [s, n] of [[1, 'l'], [-1, 'r']]) {
    const hip = grp(hips, [0.095 * s, -0.04, 0]); capsule(hip, 0.4, 0.075, jeans);
    const knee = grp(hip, [0, -0.44, 0]); capsule(knee, 0.38, 0.06, jeans);
    const ankle = grp(knee, [0, -0.43, 0]); add(new RoundedBoxGeometry(0.11, 0.08, 0.27, 3, 0.03), std({ color: 0xd8d8d8, roughness: 0.6 }), ankle, [0, -0.03, 0.06]);
    k[n] = { hip, knee, ankle };
  }
  const spine = grp(hips, [0, 0.05, 0]); k.spine = spine;
  const torso = new THREE.LatheGeometry([[0.0, 0], [0.17, 0.0], [0.175, 0.15], [0.19, 0.35], [0.2, 0.48], [0.15, 0.56], [0.06, 0.6], [0, 0.6]].map(([x, y]) => new THREE.Vector2(x, y)), 24);
  add(torso, hoodie, spine, [0, 0, 0], null, [1.15, 1, 0.7]);
  add(new THREE.TorusGeometry(0.09, 0.04, 10, 20), hoodie, spine, [0, 0.56, -0.04], [Math.PI / 2 - 0.3, 0, 0]); // capuz
  const neck = grp(spine, [0, 0.58, 0]); k.neck = neck; capsule(neck, 0.06, 0.05, skin, [0, 0.08, 0]);
  const head = grp(neck, [0, 0.1, 0]); k.head = head;
  add(new THREE.SphereGeometry(0.105, 32, 24), skin, head, [0, 0.11, 0], null, [0.92, 1.12, 1.02]);
  add(new THREE.SphereGeometry(0.09, 24, 16), skin, head, [0, 0.06, 0.02], null, [0.95, 0.9, 1]); // mandíbula
  add(new THREE.SphereGeometry(0.112, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.55), std({ color: 0x1a120c, roughness: 0.8 }), head, [0, 0.125, -0.01], [-0.25, 0, 0], [0.97, 1.1, 1.06]);
  for (const s of [-1, 1]) {
    const eye = grp(head, [0.036 * s, 0.115, 0.088]);
    add(new THREE.SphereGeometry(0.013, 16, 12), std({ color: 0xf2eee8, roughness: 0.2 }), eye, null, null, [1.1, 0.85, 0.6]);
    add(new THREE.SphereGeometry(0.0065, 12, 8), std({ color: 0x3a2414, roughness: 0.1 }), eye, [0, 0, 0.007]);
    add(new THREE.CapsuleGeometry(0.004, 0.024, 4, 8), std({ color: 0x1a120c }), head, [0.038 * s, 0.14, 0.096], [0, 0, Math.PI / 2 + 0.12 * s]);
    add(new THREE.SphereGeometry(0.022, 12, 8), skin, head, [0.098 * s, 0.1, 0], null, [0.45, 1, 0.75]);
  }
  add(new THREE.CapsuleGeometry(0.01, 0.025, 6, 10), skin, head, [0, 0.09, 0.103], [0.3, 0, 0]);
  add(new THREE.CapsuleGeometry(0.005, 0.03, 4, 8), std({ color: 0x8a4a3a }), head, [0, 0.055, 0.095], [0, 0, Math.PI / 2]);
  for (const [s, n] of [[1, 'l'], [-1, 'r']]) {
    const sh = grp(spine, [0.2 * s, 0.5, 0]); capsule(sh, 0.27, 0.06, hoodie);
    const el = grp(sh, [0, -0.29, 0]); capsule(el, 0.24, 0.05, hoodie);
    const wr = grp(el, [0, -0.27, 0]); const hand = makeHand(wr, s, skin);
    k[n].sh = sh; k[n].el = el; k[n].wr = wr; k[n].hand = hand;
  }
  return k;
}
function pose0(k) {
  for (const n of ['l', 'r']) for (const j of [k[n].hip, k[n].knee, k[n].ankle, k[n].sh, k[n].el, k[n].wr]) j.rotation.set(0, 0, 0);
  k.spine.rotation.set(0, 0, 0); k.neck.rotation.set(0, 0, 0); k.head.rotation.set(0, 0, 0); k.hips.position.set(0, 0.95, 0); k.root.rotation.set(0, 0, 0);
  k.l.sh.rotation.z = 0.08; k.r.sh.rotation.z = -0.08; curl(k.l.hand, 0.3); curl(k.r.hand, 0.3);
}
function sitFloor(k) { // sentado/encolhido no chão
  pose0(k); k.hips.position.y = 0.16;
  for (const [n, s] of [['l', 1], ['r', -1]]) { k[n].hip.rotation.set(-2.1, 0, 0.2 * s); k[n].knee.rotation.x = 2.5; k[n].sh.rotation.set(-0.9, 0, -0.35 * s); k[n].el.rotation.set(-1.3, 0, 0); }
  k.spine.rotation.x = 0.35; k.neck.rotation.x = -0.2;
}

// ====================================================================
//  "NÃO OLHE PRA CIMA" — rua na hora azul, multidão congelada, céu que abre
// ====================================================================
const WORLD = grp(scene);
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ---------- texturas ----------
const TX = {};
TX.hoodie = ctex(256, 256, (g, w, h) => speckle(g, w, h, '#2e3a2e', 0.12, 5, 8000), [2, 2]);
TX.jeans = ctex(256, 256, (g, w, h) => { speckle(g, w, h, '#2b3a5a', 0.14, 6, 8000); }, [2, 2]);
TX.asphalt = ctex(512, 512, (g, w, h) => { speckle(g, w, h, '#2a2b2e', 0.16, 11, 30000); const r = rng(12); for (let i = 0; i < 18; i++) { g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1 + r() * 2; g.beginPath(); let x = r() * w, y = r() * h; g.moveTo(x, y); for (let k = 0; k < 8; k++) { x += (r() - 0.5) * 40; y += (r() - 0.5) * 40; g.lineTo(x, y); } g.stroke(); } }, [6, 30]);
TX.walk = ctex(256, 256, (g, w, h) => { speckle(g, w, h, '#6d6a64', 0.1, 13, 9000); g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 2; for (let i = 0; i <= w; i += 64) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); } }, [3, 40]);
function facadeTex(seed, base, cols, rows, shop) {
  const r = rng(seed);
  const map = ctex(512, 1024, (g, w, h) => {
    speckle(g, w, h, base, 0.12, seed, 20000);
    const cw = w / cols, rh = (h - (shop ? 160 : 0)) / rows;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const X = x * cw + cw * 0.2, Y = y * rh + rh * 0.18, ww = cw * 0.6, hh = rh * 0.58;
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(X - 5, Y - 5, ww + 10, hh + 14);
      const gl = g.createLinearGradient(X, Y, X + ww, Y + hh); gl.addColorStop(0, '#2a3346'); gl.addColorStop(1, '#0e1220'); g.fillStyle = gl; g.fillRect(X, Y, ww, hh);
      g.fillStyle = 'rgba(160,180,220,0.18)'; g.fillRect(X, Y, ww * 0.45, hh);
      g.fillStyle = '#d8d2c6'; g.fillRect(X + ww / 2 - 2, Y, 4, hh); g.fillRect(X - 6, Y + hh + 4, ww + 12, 6);
      if (r() < 0.35) { g.fillStyle = `rgba(255,200,120,${0.25 + r() * 0.3})`; g.fillRect(X + 3, Y + 3, ww - 6, hh - 6); }
    }
    if (shop) {
      const y0 = h - 160; g.fillStyle = '#1c1e22'; g.fillRect(0, y0, w, 160);
      g.fillStyle = '#2a3a4a'; g.fillRect(30, y0 + 50, w - 60, 105);
      g.fillStyle = 'rgba(255,220,160,0.25)'; g.fillRect(40, y0 + 60, w - 80, 90);
      g.fillStyle = shop[1]; g.fillRect(20, y0 + 6, w - 40, 38); g.fillStyle = '#fff'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.fillText(shop[0], w / 2, y0 + 36);
    }
  });
  map.wrapS = THREE.RepeatWrapping;
  return map;
}
const MYFACADE = [];
const FAC = [
  facadeTex(21, '#8a7a68', 4, 6, ['PADARIA', '#8a3a1a']), facadeTex(22, '#6e7a80', 5, 7, ['FARMÁCIA', '#1a6a3a']), facadeTex(23, '#9a8e7a', 4, 6, null),
  facadeTex(24, '#7a6a72', 4, 8, ['BANCA', '#1a3a7a']), facadeTex(25, '#857f70', 5, 6, ['LANCHONETE', '#9a2a2a']), facadeTex(26, '#6a6a68', 4, 7, null),
];

// ---------- céu (shader): madrugada, nuvens, brilho no zênite e a "abertura" ----------
const skyU = { uTime: { value: 0 }, uGlow: { value: 1 }, uOpen: { value: 0 }, uDark: { value: 0 } };
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform float uTime, uGlow, uOpen, uDark; varying vec3 vDir;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f); return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
    float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * n2(p); p *= 2.03; a *= 0.5; } return s; }
    void main(){
      vec3 d = normalize(vDir); float e = clamp(d.y, -0.2, 1.0);
      vec3 hor = vec3(0.55, 0.42, 0.52), mid = vec3(0.16, 0.22, 0.42), zen = vec3(0.05, 0.08, 0.2);
      vec3 col = mix(hor, mid, smoothstep(0.0, 0.25, e)); col = mix(col, zen, smoothstep(0.25, 0.9, e));
      vec2 p = d.xz / max(d.y, 0.06);
      float c = fbm(p * 0.9 + vec2(uTime * 0.02, uTime * 0.01));
      float cl = smoothstep(0.45, 0.75, c) * smoothstep(0.02, 0.2, e);
      // brilho vindo de cima: ilumina as nuvens por baixo
      float g = pow(max(d.y, 0.0), 6.0) * uGlow;
      vec3 cloudCol = mix(vec3(0.12, 0.13, 0.2), vec3(1.6, 1.5, 1.3), clamp(g * 1.4, 0.0, 1.0));
      col = mix(col, cloudCol, cl * 0.85);
      col += vec3(1.2, 1.15, 1.0) * pow(max(d.y, 0.0), 40.0) * uGlow * 2.5;
      // a abertura: uma fenda vertical enorme no zênite, com borda acesa
      float r = length(p * vec2(1.0, 0.55));
      float slitW = mix(0.0, 0.14, uOpen);
      float inside = smoothstep(slitW, slitW - 0.05, abs(p.x) * (1.0 + p.y * p.y * 1.5)) * step(0.001, uOpen) * smoothstep(1.4, 1.0, abs(p.y));
      float rim = exp(-abs(abs(p.x) * (1.0 + p.y * p.y * 1.5) - slitW) * 22.0) * uOpen * smoothstep(1.5, 0.8, abs(p.y));
      col *= (1.0 - uDark * 0.85);
      col = mix(col, vec3(0.0), inside);
      col += vec3(3.2, 1.8, 0.9) * rim * 0.7;
      col += vec3(1.4, 0.7, 0.35) * exp(-abs(abs(p.x) * (1.0 + p.y * p.y * 1.5) - slitW) * 8.0) * uOpen * 0.1;
      float iris = exp(-abs(r - mix(0.2, 0.9, uOpen)) * 9.0) * uOpen * 0.5 * (1.0 - inside);
      col += vec3(1.2, 0.5, 0.25) * iris;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), skyMat));

// ---------- luzes ----------
const hemi = new THREE.HemisphereLight(0x8aa0d8, 0x2a221c, 1.1); scene.add(hemi);
const overhead = new THREE.DirectionalLight(0xfff2e0, 1.6);   // a luz vem de CIMA: sombras retas no chão
overhead.position.set(0.3, 60, 0.6); overhead.castShadow = true; overhead.shadow.mapSize.set(2048, 2048);

function sceneJanela(t) {

function sceneSombra(t) {

function sceneFinal(t) { grade.uniforms.uBlack.value = 1; }

const SCENES = { hook: sceneHook, quarto: sceneQuarto, janela: sceneJanela, rua: sceneRua, sombra: sceneSombra, olhar: sceneOlhar, ceu: sceneCeu, final: sceneFinal };
